name: Build GNSS-RO Application
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # 3.5.5: the tag (v3.5.5) must match __version__ in both source files,
  # so a release can never ship with a wrong version label.
  # -------------------------------------------------------------------------
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in gnss_ro_gui.py ground_gnss_ro_pipeline.py; do
            V=$(grep -m1 -oP '^__version__ = "\K[^"]+' "$f")
            echo "$f: $V  (tag: $TAG)"
            [ "$V" = "$TAG" ] || { echo "::error::$f has __version__ $V but the tag is v$TAG"; exit 1; }
          done

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.8 is the last CPython with Windows 7 support (3.9+ needs Windows 8+).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # One pip call with every pin: the resolver checks them together, so a
      # later install can never silently upgrade an earlier one (e.g. numpy).
      # This exact set passed the synthetic suite (6/6), a real UBX session and
      # the GUI test (15/15) on Python 3.8 + PyQt5.
      # PyInstaller 6.x: officially Windows 8+, "should work on Windows 7".
      # If the exe fails on Windows 7, switch to pyinstaller==5.13.2.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          pip install pyinstaller==6.3.0 pyqt5==5.15.11 numpy==1.24.4 pandas==2.0.3 matplotlib==3.7.5 scipy==1.10.1 netCDF4==1.6.5 xarray==2023.1.0

      # Catches library-version bugs (like np.trapezoid on NumPy 1.x) before building.
      # Runs only if test_mountain_ro.py is committed to the repo; skipped otherwise.
      - name: Self-test (synthetic retrieval)
        shell: pwsh
        run: |
          if (Test-Path test_mountain_ro.py) { python test_mountain_ro.py; if ($LASTEXITCODE -ne 0) { exit 1 } }
          else { Write-Host "test_mountain_ro.py not in the repo - self-test skipped" }

      # --onedir instead of --onefile: no unpacking to %TEMP% on every start
      # (faster, and each multiprocessing worker does not re-extract), far fewer
      # antivirus false positives, and DLL problems are visible in the folder.
      - name: Build Windows app
        run: |
          pyinstaller `
            --onedir `
            --windowed `
            --name "GNSS-RO" `
            --add-data "assets;assets" `
            --hidden-import "qt_compat" `
            --hidden-import "login_ui" `
            --hidden-import "plot_style" `
            --hidden-import "ground_gnss_ro_pipeline" `
            --hidden-import "sat_gnss_ro_pipeline" `
            --hidden-import "rinex_parser" `
            --hidden-import "PyQt5.QtWidgets" `
            --hidden-import "PyQt5.QtCore" `
            --hidden-import "PyQt5.QtGui" `
            --hidden-import "matplotlib.backends.backend_qtagg" `
            --hidden-import "matplotlib.backends.backend_qt5agg" `
            gnss_ro_gui.py

      - name: Zip Windows app
        run: Compress-Archive -Path dist\GNSS-RO -DestinationPath dist\GNSS-RO-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GNSS-RO-Windows
          path: dist/GNSS-RO-Windows.zip
          retention-days: 30

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GNSS-RO-Windows
          path: windows
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/GNSS-RO-Windows.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
